<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AssetCare — Assets</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="flex min-h-screen">
  <div id="sidebar-root"></div>

  <div class="flex-1 min-w-0">
    <div id="topbar-root"></div>

    <main class="p-4 sm:p-6 lg:p-8 max-w-[1400px] mx-auto">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-6">
        <div>
          <h1 class="text-2xl font-extrabold">Digital Asset Registry</h1>
          <p class="text-sm text-[var(--ink-soft)] mt-1">Every tracked asset, its condition, and where it lives.</p>
        </div>
        <button class="btn-primary w-full sm:w-auto" style="background:#0b1e33;">+ Register asset</button>
      </div>

      <div id="asset-grid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-5"></div>
    </main>
  </div>
</div>

<script src="js/app.js"></script>
<script>
  seedIfEmpty();
  requireAuth();
  renderSidebar('assets');
  renderTopbar('Search by code, name, or location…');
  renderAssets();
</script>
</body>
</html>
