<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AssetCare — Issues</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="flex min-h-screen">
  <div id="sidebar-root"></div>

  <div class="flex-1 min-w-0">
    <div id="topbar-root"></div>

    <main class="p-4 sm:p-6 lg:p-8 max-w-[1400px] mx-auto">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-6">
        <div>
          <h1 class="text-2xl font-extrabold">Issues Control Center</h1>
          <p class="text-sm text-[var(--ink-soft)] mt-1">Every fault report, its owner, and current status.</p>
        </div>
        <button class="btn-primary w-full sm:w-auto" style="background:#0b1e33;">+ Log issue</button>
      </div>

      <div class="card overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-left">
            <thead>
              <tr class="border-b border-[var(--line)] bg-[#fafbfc]">
                <th class="py-3 px-5 text-xs font-bold text-[var(--ink-soft)] uppercase tracking-wide">Issue UID</th>
                <th class="py-3 px-5 text-xs font-bold text-[var(--ink-soft)] uppercase tracking-wide">Asset</th>
                <th class="py-3 px-5 text-xs font-bold text-[var(--ink-soft)] uppercase tracking-wide">Fault description</th>
                <th class="py-3 px-5 text-xs font-bold text-[var(--ink-soft)] uppercase tracking-wide">Technician</th>
                <th class="py-3 px-5 text-xs font-bold text-[var(--ink-soft)] uppercase tracking-wide">Priority</th>
                <th class="py-3 px-5 text-xs font-bold text-[var(--ink-soft)] uppercase tracking-wide">Status</th>
                <th class="py-3 px-5 text-xs font-bold text-[var(--ink-soft)] uppercase tracking-wide">Reported</th>
              </tr>
            </thead>
            <tbody id="issues-tbody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="js/app.js"></script>
<script>
  seedIfEmpty();
  requireAuth();
  renderSidebar('issues');
  renderTopbar('Search issue UID, asset, or technician…');
  renderIssues();
</script>
</body>
</html>
