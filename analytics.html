<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AssetCare — Analytics</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="flex min-h-screen">
  <div id="sidebar-root"></div>

  <div class="flex-1 min-w-0">
    <div id="topbar-root"></div>

    <main class="p-4 sm:p-6 lg:p-8 max-w-[1400px] mx-auto">
      <div class="mb-6">
        <h1 class="text-2xl font-extrabold">Analytics</h1>
        <p class="text-sm text-[var(--ink-soft)] mt-1">Trends across assets, issues, and completed work.</p>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
        <div class="card p-5">
          <p class="text-xs font-bold text-[var(--ink-soft)] uppercase tracking-wide">Resolution rate</p>
          <p id="kpi-resolution-rate" class="text-2xl sm:text-3xl font-extrabold mt-1.5 text-[var(--teal-dark)]">—</p>
        </div>
        <div class="card p-5">
          <p class="text-xs font-bold text-[var(--ink-soft)] uppercase tracking-wide">Currently open</p>
          <p id="kpi-avg-open" class="text-2xl sm:text-3xl font-extrabold mt-1.5 text-[var(--red-ink)]">—</p>
        </div>
        <div class="card p-5">
          <p class="text-xs font-bold text-[var(--ink-soft)] uppercase tracking-wide">Maintenance done</p>
          <p id="kpi-completed-maint" class="text-2xl sm:text-3xl font-extrabold mt-1.5 text-[var(--emerald-ink)]">—</p>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <div class="card p-5 sm:p-6">
          <p class="font-bold mb-5">Assets by category</p>
          <div id="category-bars" class="space-y-4"></div>
        </div>
        <div class="card p-5 sm:p-6">
          <p class="font-bold mb-4">Issues by status</p>
          <div class="flex flex-col xs:flex-row items-center gap-6">
            <div id="status-donut" class="mx-auto sm:mx-0"></div>
            <div id="status-legend" class="flex-1 w-full"></div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="js/app.js"></script>
<script>
  seedIfEmpty();
  requireAuth();
  renderSidebar('analytics');
  renderTopbar('Search analytics…');
  renderAnalytics();
</script>
</body>
</html>
