<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AssetCare — Notifications</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="flex min-h-screen">
  <div id="sidebar-root"></div>

  <div class="flex-1 min-w-0">
    <div id="topbar-root"></div>

    <main class="p-4 sm:p-6 lg:p-8 max-w-[1000px] mx-auto">
      <div class="flex items-center justify-between mb-6">
        <div>
          <h1 class="text-2xl font-extrabold">Notifications</h1>
          <p class="text-sm text-[var(--ink-soft)] mt-1">Everything that needs your attention, most recent first.</p>
        </div>
        <button class="text-sm font-bold text-[var(--teal-dark)]">Mark all as read</button>
      </div>

      <div class="card p-2">
        <div id="notif-list" class="px-1 sm:px-4"></div>
      </div>
    </main>
  </div>
</div>

<script src="js/app.js"></script>
<script>
  seedIfEmpty();
  requireAuth();
  renderSidebar('notifications');
  renderTopbar('Search notifications…');
  renderNotifications();
</script>
</body>
</html>
