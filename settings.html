<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AssetCare — Settings</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="flex min-h-screen">
  <div id="sidebar-root"></div>

  <div class="flex-1 min-w-0">
    <div id="topbar-root"></div>

    <main class="p-4 sm:p-6 lg:p-8 max-w-[760px] mx-auto">
      <div class="mb-6">
        <h1 class="text-2xl font-extrabold">Settings</h1>
        <p class="text-sm text-[var(--ink-soft)] mt-1">Your account and notification preferences.</p>
      </div>

      <form id="settings-form" class="space-y-5">

        <div class="card p-5 sm:p-6">
          <p class="font-bold mb-4">Profile</p>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="text-xs font-bold text-[var(--ink-soft)] uppercase tracking-wide">Full name</label>
              <input id="settings-name" class="field-input mt-1.5" disabled />
            </div>
            <div>
              <label class="text-xs font-bold text-[var(--ink-soft)] uppercase tracking-wide">Email address</label>
              <input id="settings-email" class="field-input mt-1.5" disabled />
            </div>
          </div>
          <div class="mt-4">
            <span class="chip chip-teal" id="settings-role">—</span>
          </div>
        </div>

        <div class="card p-5 sm:p-6">
          <p class="font-bold mb-4">Notification preferences</p>

          <label class="flex items-center justify-between py-3 border-b border-[var(--line)] cursor-pointer">
            <div>
              <p class="text-sm font-bold">Email alerts</p>
              <p class="text-xs text-[var(--ink-soft)]">Get emailed when a new issue is reported</p>
            </div>
            <input type="checkbox" id="toggle-email-alerts" class="chk" />
          </label>

          <label class="flex items-center justify-between py-3 border-b border-[var(--line)] cursor-pointer">
            <div>
              <p class="text-sm font-bold">Critical issues only</p>
              <p class="text-xs text-[var(--ink-soft)]">Mute everything except critical-priority reports</p>
            </div>
            <input type="checkbox" id="toggle-critical-only" class="chk" />
          </label>

          <label class="flex items-center justify-between py-3 cursor-pointer">
            <div>
              <p class="text-sm font-bold">Weekly digest</p>
              <p class="text-xs text-[var(--ink-soft)]">A Monday-morning summary of open work</p>
            </div>
            <input type="checkbox" id="toggle-weekly-digest" class="chk" />
          </label>
        </div>

        <div class="flex items-center gap-4">
          <button type="submit" class="btn-primary" style="background:#0b1e33;">Save changes</button>
          <p id="settings-saved" class="hidden text-sm font-semibold text-[var(--emerald-ink)]">Saved.</p>
        </div>
      </form>
    </main>
  </div>
</div>

<script src="js/app.js"></script>
<script>
  seedIfEmpty();
  requireAuth();
  renderSidebar('settings');
  renderTopbar('Search settings…');
  renderSettings();
</script>
</body>
</html>
