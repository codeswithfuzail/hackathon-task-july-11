<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AssetCare — Scheduled Maintenance</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="flex min-h-screen">
  <div id="sidebar-root"></div>

  <div class="flex-1 min-w-0">
    <div id="topbar-root"></div>

    <main class="p-4 sm:p-6 lg:p-8 max-w-[1400px] mx-auto">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-6">
        <div>
          <h1 class="text-2xl font-extrabold">Scheduled Maintenance</h1>
          <p class="text-sm text-[var(--ink-soft)] mt-1">Upcoming and completed maintenance work, by asset.</p>
        </div>
        <button class="btn-primary w-full sm:w-auto" style="background:#0b1e33;">+ Schedule task</button>
      </div>

      <div class="grid grid-cols-2 lg:grid-cols-3 gap-4 mb-6">
        <div class="card p-5">
          <p class="text-xs font-bold text-[var(--ink-soft)] uppercase tracking-wide">Upcoming</p>
          <p id="kpi-upcoming" class="text-2xl sm:text-3xl font-extrabold mt-1.5 text-[var(--amber-ink)]">—</p>
        </div>
        <div class="card p-5">
          <p class="text-xs font-bold text-[var(--ink-soft)] uppercase tracking-wide">Due this week</p>
          <p id="kpi-this-week" class="text-2xl sm:text-3xl font-extrabold mt-1.5" style="color:#0b1e33;">—</p>
        </div>
        <div class="card p-5">
          <p class="text-xs font-bold text-[var(--ink-soft)] uppercase tracking-wide">Completed</p>
          <p id="kpi-completed" class="text-2xl sm:text-3xl font-extrabold mt-1.5 text-[var(--emerald-ink)]">—</p>
        </div>
      </div>

      <div class="card overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-left">
            <thead>
              <tr class="border-b border-[var(--line)] bg-[#fafbfc]">
                <th class="py-3 px-5 text-xs font-bold text-[var(--ink-soft)] uppercase tracking-wide">Asset</th>
                <th class="py-3 px-5 text-xs font-bold text-[var(--ink-soft)] uppercase tracking-wide">Task</th>
                <th class="py-3 px-5 text-xs font-bold text-[var(--ink-soft)] uppercase tracking-wide">Technician</th>
                <th class="py-3 px-5 text-xs font-bold text-[var(--ink-soft)] uppercase tracking-wide">Date</th>
                <th class="py-3 px-5 text-xs font-bold text-[var(--ink-soft)] uppercase tracking-wide">Status</th>
              </tr>
            </thead>
            <tbody id="maintenance-tbody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="js/app.js"></script>
<script>
  seedIfEmpty();
  requireAuth();
  renderSidebar('maintenance');
  renderTopbar('Search scheduled tasks…');
  renderMaintenance();
</script>
</body>
</html>
